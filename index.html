
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaoDoc Translate - Professional Document Workflow</title>
    <meta name="description" content="High-precision Lao-to-Chinese translator for complex PDF documents, preserving layouts and tables using Gemini's multimodal capabilities.">
    <meta property="og:title" content="LaoDoc Translate - Professional Document Workflow">
    <meta property="og:description" content="High-precision Lao-to-Chinese translator for complex PDF documents, preserving layouts and tables using Gemini's multimodal capabilities.">
    <script>
        // Polyfill process.env for Node.js libraries like @google/genai in browser
        window.process = { env: {} };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Lao:wght@300;400;500;600;700&family=Phetsarath:wght@400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Lao:wght@300;400;500;600;700&family=Phetsarath:wght@400;700&display=swap" rel="stylesheet">
    </noscript>
    <style>
        @font-face {
            font-family: 'Phetsarath OT';
            font-weight: 400;
            src: local('Phetsarath OT'), local('Phetsarath-OT'), local('Phetsarath Regular'), local('Phetsarath');
        }
        @font-face {
            font-family: 'Phetsarath OT';
            font-weight: 700;
            src: local('Phetsarath OT Bold'), local('Phetsarath-OT-Bold'), local('Phetsarath Bold');
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Times New Roman', 'Microsoft YaHei', sans-serif;
            background-color: #F8FAFC;
        }
        .lao-text, :lang(lo) {
            font-family: 'Phetsarath OT', 'Phetsarath', 'Noto Sans Lao', sans-serif;
        }
        /* Custom scrollbar for professional look */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="root">
        <div id="app-loading" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #F8FAFC; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #475569;">
            <div style="width: 38px; height: 38px; border: 3px solid #E2E8F0; border-top-color: #0D9488; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
            <div style="margin-top: 16px; font-size: 14px; font-weight: 600; color: #1E293B;">LaoDoc 翻译系统加载中...</div>
            <div style="margin-top: 6px; font-size: 12px; color: #94A3B8;">请稍候，正在初始化应用界面</div>
        </div>
        <style>
            @keyframes spin { to { transform: rotate(360deg); } }
        </style>
    </div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
